<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container { text-align: center; width: 100%; padding: 30px; }
        .logo {
            font-family: "Brush Script MT", "Segoe Script", cursive;
            font-size: 52px;
            margin-bottom: 45px;
            font-weight: 600;
            letter-spacing: -1px;
            background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.45;
            color: #fff;
        }
        .subtext {
            margin-top: 10px;
            color: #a8a8a8;
            font-size: 14px;
        }
        .try-again {
            margin-top: 24px;
            padding: 9px 22px;
            border: 0;
            border-radius: 8px;
            background: #0095f6;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Instagram</div>
        <div class="error">
            Password or username wrong<br>
            Please try again
        </div>
        <div class="subtext">
            Check your login information and try again.
        </div>
        <button class="try-again" onclick="location.href='index.html'">
            Try Again
        </button>
    </div>
</body>
</html>
